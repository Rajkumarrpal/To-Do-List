<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">

        <div class="header">
            <h1>My Todo List</h1>

            <p>
                Organize your tasks
            </p>
        </div>


        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button
                class="add-btn"
                id="addBtn"
            >
                Add
            </button>

        </div>


        <ul
            class="task-list"
            id="taskList"
        >

            <!-- JavaScript se tasks yaha add honge -->

        </ul>


        <div
            class="task-count"
            id="taskCount"
        >
            Total Tasks: 0
        </div>

    </div>


    
    <script src="script.js"></script>
</body>
</html>
